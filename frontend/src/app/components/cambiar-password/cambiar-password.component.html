<main class="password-page">
  <section class="password-card">
    <p class="eyebrow">SEGURIDAD DE LA CUENTA</p>
    <h1>Cambia tu contraseña</h1>
    <p>Antes de continuar, establece una contraseña personal de al menos 12 caracteres.</p>
    @if (error()) { <p class="notice error" role="alert">{{ error() }}</p> }
    @if (message()) { <p class="notice success" role="status">{{ message() }}</p> }
    <form (ngSubmit)="submit()">
      <label>Contraseña actual<input name="currentPassword" type="password" [(ngModel)]="currentPassword" autocomplete="current-password" required /></label>
      <label>Nueva contraseña<input name="newPassword" type="password" [(ngModel)]="newPassword" minlength="12" maxlength="72" autocomplete="new-password" required /></label>
      <label>Repetir nueva contraseña<input name="confirmPassword" type="password" [(ngModel)]="confirmPassword" minlength="12" maxlength="72" autocomplete="new-password" required /></label>
      <button type="submit" [disabled]="busy()">{{ busy() ? 'Guardando…' : 'Actualizar contraseña' }}</button>
    </form>
  </section>
</main>
