<div class="app-layout">
  <!-- Header Bar -->
  <header class="top-navbar">
    <div class="navbar-brand">
      <div class="brand-dots">
        <span class="dot dot-lime"></span>
        <span class="dot dot-midgreen"></span>
        <span class="dot dot-lime"></span>
        <span class="dot dot-midgreen"></span>
        <span class="dot dot-darkgreen"></span>
        <span class="dot dot-midgreen"></span>
        <span class="dot dot-lime"></span>
        <span class="dot dot-midgreen"></span>
        <span class="dot dot-lime"></span>
      </div>
      <div class="brand-text">
        <span class="brand-name">TOTTUS</span>
        <span class="brand-badge">INVENTARIO</span>
      </div>
    </div>

    <!-- Center/Right controls -->
    <div class="navbar-actions">
      <!-- Sede selector -->
      <div class="sede-selector-wrapper">
        <svg class="sede-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        <span class="sede-label">Sede:</span>
        <select
          class="sede-select"
          [ngModel]="activeSedeId()"
          (ngModelChange)="onSedeChange($event)"
        >
          @for (sede of sedes(); track sede.idSede) {
            <option [value]="sede.idSede">{{ sede.nombre }}</option>
          }
        </select>
      </div>

      <!-- User Profile & Logout -->
      <div class="user-profile-badge">
        <div class="user-avatar">
          {{ currentUser()?.usuario?.charAt(0)?.toUpperCase() || 'U' }}
        </div>
        <div class="user-info">
          <span class="user-name">{{ currentUser()?.usuario || 'gerencia_admin' }}</span>
          <span class="user-role">{{ currentUser()?.rol || 'ADMIN' }}</span>
        </div>
        <button class="logout-btn" (click)="logout()" title="Cerrar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Body Content -->
  <main class="layout-content">
    <router-outlet></router-outlet>
  </main>
</div>
